<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadline Heavyweight — 3D Workload Stress Visualizer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#07090e',
              panel: '#0d121d',
              card: '#131b2e',
              accent: '#6366f1'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/custom.css">

  <!-- Three.js & Cannon Physics Libraries (Vendored Local for 100% Offline Resilience) -->
  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/OrbitControls.js"></script>
  <script src="/vendor/cannon.min.js"></script>
</head>
<body class="h-screen w-screen bg-[#07090e] text-slate-100 flex flex-col select-none overflow-hidden">

  <!-- Top Native App Bar -->
  <header class="h-12 border-b border-slate-800/80 bg-[#090d16] px-4 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 via-purple-600 to-red-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      </div>
      <div>
        <h1 class="text-sm font-extrabold tracking-wider font-mono text-white flex items-center gap-2">
          DEADLINE HEAVYWEIGHT
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-400 border border-indigo-800">v1.0</span>
        </h1>
      </div>
    </div>

    <!-- Quick Status / Mode -->
    <div class="flex items-center gap-4 text-xs font-mono">
      <div class="flex items-center gap-2 bg-slate-900/90 px-3 py-1 rounded-full border border-slate-800">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span class="text-slate-400">Offline Engine:</span>
        <span class="text-emerald-400 font-bold">ACTIVE</span>
      </div>
      <label class="flex items-center gap-1.5 cursor-pointer text-slate-400 hover:text-slate-200">
        <input type="checkbox" id="llm-toggle" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
        <span>Deep LLM</span>
      </label>
    </div>
  </header>

  <!-- Main Split-Pane Workspace -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- LEFT PANEL: Raw Input & Metrics (420px width fixed or flexible) -->
    <section class="w-[440px] shrink-0 border-r border-slate-800/80 bg-[#0d121d] flex flex-col h-full z-10">
      
      <!-- Upper Section: Input & Controls -->
      <div class="p-4 border-b border-slate-800/80 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold uppercase tracking-wider font-mono text-slate-300 flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Nhập ghi chú / Deadline
          </label>
          <!-- Sample Presets -->
          <div class="flex items-center gap-1">
            <button id="sample-overload" class="text-[11px] px-2 py-0.5 rounded bg-red-950/70 text-red-300 border border-red-800/60 hover:bg-red-900 transition" title="Mẫu quá tải gấp">P0 Gấp</button>
            <button id="sample-balanced" class="text-[11px] px-2 py-0.5 rounded bg-amber-950/70 text-amber-300 border border-amber-800/60 hover:bg-amber-900 transition" title="Mẫu trung bình">Vừa phải</button>
            <button id="sample-chill" class="text-[11px] px-2 py-0.5 rounded bg-cyan-950/70 text-cyan-300 border border-cyan-800/60 hover:bg-cyan-900 transition" title="Mẫu thong thả">Thư thả</button>
          </div>
        </div>

        <!-- Raw Textarea -->
        <div class="relative">
          <textarea id="raw-input" rows="5" placeholder="Dán danh sách công việc tự do tại đây... (Ví dụ: 'Sửa lỗi thanh toán trước 17h gấp (2h)', 'Họp team sáng mai (1h)')..." class="w-full bg-[#07090e] border border-slate-700/80 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-500 font-mono focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none transition"></textarea>
          <button id="clear-btn" class="absolute bottom-2.5 right-2.5 text-[11px] px-2 py-0.5 rounded bg-slate-800/80 text-slate-400 hover:text-slate-200 hover:bg-slate-700 transition">Xóa</button>
        </div>

        <!-- Action Button -->
        <button id="weigh-btn" class="w-full py-2.5 px-4 rounded-xl font-bold text-xs tracking-wider uppercase font-mono bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 hover:from-indigo-500 hover:to-purple-600 text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
          <span id="loading-spinner" class="hidden w-3.5 h-3.5 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
          CÂN TẢI TRỌNG (WEIGH STRESS)
        </button>
      </div>

      <!-- Middle Section: Stress Gauge & Metrics Dashboard -->
      <div class="p-4 border-b border-slate-800/80 bg-[#090d16]/70 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-mono font-bold text-slate-400 uppercase tracking-wider">Tổng quan tải trọng</span>
          <span id="stress-state-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold font-mono uppercase bg-slate-800 text-slate-400">
            CHỜ PHÂN TÍCH
          </span>
        </div>

        <!-- Big Metric Grid -->
        <div class="grid grid-cols-3 gap-2">
          <div class="p-2.5 rounded-lg bg-slate-900/80 border border-slate-800/90 flex flex-col">
            <span class="text-[10px] font-mono text-slate-400 uppercase">Tổng thời lượng</span>
            <span id="total-hours-val" class="text-base font-extrabold font-mono text-white mt-0.5">0h</span>
          </div>
          <div class="p-2.5 rounded-lg bg-slate-900/80 border border-slate-800/90 flex flex-col">
            <span class="text-[10px] font-mono text-slate-400 uppercase">Áp lực TB</span>
            <div class="flex items-baseline gap-1 mt-0.5">
              <span id="avg-weight-val" class="text-base font-extrabold font-mono text-indigo-400">0</span>
              <span class="text-[10px] text-slate-500 font-mono">/100</span>
            </div>
          </div>
          <div class="p-2.5 rounded-lg bg-slate-900/80 border border-slate-800/90 flex flex-col">
            <span class="text-[10px] font-mono text-slate-400 uppercase">Độ gấp cao nhất</span>
            <span id="peak-urgency-val" class="text-base font-extrabold font-mono text-amber-400 mt-0.5">0 / 10</span>
          </div>
        </div>

        <!-- Stress Weight Progress Bar -->
        <div class="flex flex-col gap-1">
          <div class="h-2 w-full rounded-full bg-slate-800 overflow-hidden">
            <div id="weight-progress-bar" class="h-full bg-indigo-500 w-0 transition-all duration-500"></div>
          </div>
        </div>

        <!-- Dynamic Warning Box for Overload -->
        <div id="stress-warning-box" class="hidden p-3 rounded-xl bg-red-950/40 border border-red-800/80"></div>
      </div>

      <!-- Lower Section: Task Breakdown Cards -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <div class="px-4 py-2 bg-[#0c101a] border-b border-slate-800/60 flex items-center justify-between">
          <span class="text-xs font-mono font-bold text-slate-400 uppercase tracking-wider">Danh sách chi tiết</span>
          <span id="task-count-badge" class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-slate-800 text-slate-300">0 TASKS</span>
        </div>
        <div id="tasks-container" class="flex-1 overflow-y-auto p-4 space-y-2.5">
          <!-- Rendered dynamically by ui.js -->
        </div>
      </div>

    </section>

    <!-- RIGHT PANEL: 3D Canvas Viewport (Three.js + Cannon-es) -->
    <section id="viewport-container" class="flex-1 relative bg-[#04060a] overflow-hidden flex items-center justify-center">
      
      <!-- 3D Canvas -->
      <canvas id="three-canvas" class="w-full h-full block focus:outline-none"></canvas>

      <!-- Floating Top HUD -->
      <div class="absolute top-4 left-4 right-4 flex items-center justify-between pointer-events-none z-10">
        <div class="pointer-events-auto flex items-center gap-2 bg-[#0d121d]/85 backdrop-blur-md px-3.5 py-1.5 rounded-xl border border-slate-800/80 shadow-2xl">
          <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-sm shadow-indigo-400 animate-pulse"></div>
          <span class="text-xs font-mono font-bold text-slate-200">PHYSICS RIGID-BODY SIMULATOR</span>
          <span class="text-slate-600">|</span>
          <span class="text-[11px] font-mono text-slate-400">Cannon-es Engine</span>
        </div>

        <!-- Controls on Top Right -->
        <div class="pointer-events-auto flex items-center gap-2">
          <!-- Audio Toggle -->
          <button id="btn-audio-toggle" class="px-3 py-1.5 rounded-xl bg-[#0d121d]/85 backdrop-blur-md border border-slate-800/80 hover:border-indigo-500 text-xs font-mono text-slate-300 hover:text-white flex items-center gap-1.5 transition shadow-xl" title="Bật/Tắt âm thanh va chạm">
            <svg id="icon-audio-on" class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            <span id="audio-status-text">Audio: ON</span>
          </button>
        </div>
      </div>

      <!-- Floating Bottom Controls & Simulation Triggers -->
      <div class="absolute bottom-5 left-1/2 -translate-x-1/2 flex items-center gap-3 z-10 pointer-events-auto">
        <button id="btn-drop-physics" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-mono font-bold text-xs uppercase tracking-wider shadow-2xl shadow-indigo-600/40 flex items-center gap-2 transition active:scale-95 border border-indigo-400/30">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
          THẢ LẠI KHỐI (RE-DROP)
        </button>

        <button id="btn-reset-view" class="px-4 py-2.5 rounded-xl bg-[#0d121d]/90 hover:bg-slate-800 border border-slate-700/80 text-slate-300 hover:text-white font-mono font-semibold text-xs tracking-wider transition flex items-center gap-1.5 shadow-xl">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Góc nhìn chuẩn
        </button>
      </div>

      <!-- 3D Interactive Controls Tooltip -->
      <div class="absolute bottom-5 right-5 pointer-events-none text-xs font-mono text-slate-300 bg-[#0d121d]/90 backdrop-blur-md px-3.5 py-2 rounded-xl border border-indigo-500/20 shadow-2xl flex items-center gap-2">
        <span class="text-indigo-400 font-bold">🎮 Kéo & Thả 3D:</span>
        <span class="text-slate-300">Nhấp giữ khối để gắp & ném • Nhấp nền để xoay • Cuộn để phóng to</span>
      </div>

    </section>

  </main>

  <!-- Application Scripts -->
  <script src="/js/audio.js"></script>
  <script src="/js/materials.js"></script>
  <script src="/js/camera.js"></script>
  <script src="/js/physics.js"></script>
  <script src="/js/scene.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
</body>
</html>
