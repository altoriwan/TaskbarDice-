<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskbarDice - Retro Dice Widget</title>
  <!-- Google Fonts: Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- NES.css 2.3.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nes.css/2.3.0/css/nes.min.css">
  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #212529;
      color: #fff;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .widget-container {
      width: 100%;
      max-width: 280px;
      box-sizing: border-box;
      background: #2b2b36;
      border-radius: 4px;
      padding: 8px;
    }

    .header-title {
      font-size: 10px;
      text-align: center;
      margin-bottom: 8px;
      color: #ffd700;
    }

    .dice-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80px;
      margin-bottom: 8px;
    }

    .dice-box {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: #ffffff;
      color: #000;
      border: 4px solid #000;
      box-shadow: inset -4px -4px #adb5bd;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .dice-box:hover {
      transform: scale(1.05);
    }

    .dice-box:active {
      transform: scale(0.95);
    }

    .actions {
      display: flex;
      justify-content: center;
    }

    .btn-roll {
      font-size: 8px;
      padding: 6px 12px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="widget-container nes-container is-dark with-title">
    <p class="title header-title">TASKBAR DICE</p>
    <div class="dice-stage">
      <div id="dice" class="dice-box nes-pointer" title="Click to Roll">6</div>
    </div>
    <div class="actions">
      <button id="rollBtn" type="button" class="nes-btn is-primary btn-roll">ROLL</button>
    </div>
  </div>

  <script>
    const dice = document.getElementById('dice');
    const rollBtn = document.getElementById('rollBtn');

    function rollDice() {
      rollBtn.disabled = true;
      let count = 0;
      const interval = setInterval(() => {
        const temp = Math.floor(Math.random() * 6) + 1;
        dice.textContent = temp;
        count++;
        if (count > 8) {
          clearInterval(interval);
          const finalVal = Math.floor(Math.random() * 6) + 1;
          dice.textContent = finalVal;
          rollBtn.disabled = false;
        }
      }, 50);
    }

    dice.addEventListener('click', rollDice);
    rollBtn.addEventListener('click', rollDice);
  </script>
</body>
</html>
