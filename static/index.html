        // Apply Twitch vibration micro-jitter for Stage 5 (rot >= 0.8)
        const jitter = calculateTwitchJitter(rot, i, now);
        const dieRenderX = centerX + jitter.dx;
        const dieRenderY = renderY + jitter.dy;

        // Spawn continuous viscous slime drips for Stage 5
        if (rot >= 0.8) {
          spawnStage5SlimeDrip(dieRenderX, dieRenderY, cfg.width / 2, cfg.ry, cfg.height, rot);
        }

        // Contact shadow (subtly tracks x jitter)
        if (i > 0) {
          ctx.fillStyle = (rot >= 0.75) ? 'rgba(5, 46, 22, 0.35)' : 'rgba(0, 0, 0, 0.25)';
          ctx.beginPath();
          ctx.ellipse(centerX + jitter.dx * 0.25, renderY + cfg.height + 2, cfg.width * 0.5, 5, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Render die with jittered coordinates
        drawRotIsometricDice(ctx, dieRenderX, dieRenderY, cfg.width, cfg.height, d.weight_score, d.title, rot);

        // If overdue, draw pulsating overdue banner above die
        if (rot >= 1.0) {
          drawOverdueDieBanner(ctx, dieRenderX, dieRenderY, cfg.width, cfg.ry);
        }

        // 2px Glowing pixel border for hovered resting die (synchronized with jitter)
        if (d === hoveredDie) {
          ctx.save();
          const glowAlpha = 0.65 + 0.35 * Math.sin(now * 0.008);
          const isOverdue = (rot >= 1.0);
          ctx.shadowColor = isOverdue ? '#e76e55' : '#ffd700';
          ctx.shadowBlur = 6;
          ctx.strokeStyle = isOverdue ? `rgba(231, 110, 85, ${glowAlpha})` : `rgba(255, 215, 0, ${glowAlpha})`; // 2px glowing pixel border
          ctx.lineWidth = 2;
          ctx.strokeRect(dieRenderX - cfg.width / 2 - 2, dieRenderY - cfg.ry - 2, cfg.width + 4, cfg.height + cfg.ry * 2 + 4);
          ctx.restore();
        }
      }

      ctx.restore(); // restore wobble transform

      // 4. Update and draw dripping slime particles
      updateAndDrawSlime(ctx);

      // 5. Update and draw explosion particles
      updateAndDrawExplosions(ctx);

      // 6. Draw floating streak multiplier texts
      updateAndDrawFloatingTexts(ctx);

      // Floating retro tooltip for hovered resting die
      if (hoveredDie) {
        drawRetroTooltip(ctx, hoveredDie);
      }

      // 7. Draw Overload Banner if at 10-task limit
      if (isOverloaded) {
        drawOverloadBanner(ctx);
      }

      ctx.restore(); // restore screen shake

      requestAnimationFrame(animationLoop);
    }

    requestAnimationFrame(animationLoop);

    /**
     * Initial tasks load
     */
    function initTasks() {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.get_tasks) {
        window.pywebview.api.get_tasks().then((tasks) => {
          hasLoadedTasksOnce = true;
          if (Array.isArray(tasks) && tasks.length > 0) {
            hasHadTasks = true;
            tasks.forEach(t => addDieToStack(t, true));
          }
        }).catch(err => {
          console.error('[TaskbarDice] get_tasks error:', err);
        });
      }
    }

    window.addEventListener('pywebviewready', () => {
      initTasks();
    });

    setTimeout(() => {
      if (diceStack.length === 0 && !hasLoadedTasksOnce) {
        initTasks();
      }
    }, 300);

    // Control Panel State & 2-Row Event Handling
    let selectedWeight = 1;
    let selectedDurationMinutes = 25;

    const weightButtons = document.querySelectorAll('.weight-btn');
    weightButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        weightButtons.forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        selectedWeight = parseInt(btn.dataset.w, 10);
      });
    });

    const timeButtons = document.querySelectorAll('.time-btn');
    const customTimeBtn = document.getElementById('customTimeBtn');

    function parseTimePreset(tStr) {
      if (tStr === '15m') return 15;
      if (tStr === '25m') return 25;
      if (tStr === '1h') return 60;
      if (tStr === '4h') return 240;
      return null;
    }

    timeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const tVal = btn.dataset.t;
        if (tVal === 'custom') {
          const customPrompt = prompt('Enter custom duration in minutes (1 - 1440):', '30');
          if (customPrompt !== null) {
            const mins = parseInt(customPrompt, 10);
            if (!isNaN(mins) && mins > 0 && mins <= 1440) {
              timeButtons.forEach(b => b.classList.remove('is-active'));
              btn.classList.add('is-active');
              btn.textContent = `${mins}m`;
              selectedDurationMinutes = mins;
            }
          }
        } else {
          timeButtons.forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          selectedDurationMinutes = parseTimePreset(tVal) || 25;
        }
      });
    });

    // Programmatic test hooks for probes / E2E verification
    window.setSelectedWeight = (w) => {
      selectedWeight = parseInt(w, 10);
      weightButtons.forEach(b => {
        b.classList.toggle('is-active', parseInt(b.dataset.w, 10) === selectedWeight);
      });
    };
    window.setSelectedDuration = (m) => {
      selectedDurationMinutes = parseInt(m, 10);
      timeButtons.forEach(b => {
        const val = parseTimePreset(b.dataset.t);
        b.classList.toggle('is-active', val === selectedDurationMinutes);
      });
    };
    window.getSelectedWeight = () => selectedWeight;
    window.getSelectedDuration = () => selectedDurationMinutes;

    // Form submission
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      hasHadTasks = true;
      hasClearedAll = false;

      // 10-Task Overload Rejection & NES warning shake
      if (diceStack.length >= 10) {
        const panel = document.querySelector('.control-panel') || document.querySelector('.bottom-bar');
        if (panel) {
          panel.classList.remove('shake-anim');
          void panel.offsetWidth; // trigger reflow
          panel.classList.add('shake-anim');
        }
        showToast('OVERLOAD! CLEAR A TASK');
        triggerScreenShake(4, 2);
        return;
      }

      taskInput.value = '';
      taskInput.focus();

      if (window.pywebview && window.pywebview.api && window.pywebview.api.add_task) {
        window.pywebview.api.add_task(text, selectedWeight, selectedDurationMinutes).then((res) => {
          if (res && res.status === 'ok' && res.task) {
            addDieToStack(res.task, false);
            showToast(`+${res.task.title.substring(0, 8)} (W:${res.task.weight_score})`);
          } else if (res && res.error === 'overload') {
            const panel = document.querySelector('.control-panel') || document.querySelector('.bottom-bar');
            if (panel) {
              panel.classList.remove('shake-anim');
              void panel.offsetWidth;
              panel.classList.add('shake-anim');
            }
            showToast('TOWER OVERLOAD (10/10)!');
          }
        }).catch((err) => {
          console.error('[TaskbarDice] add_task error:', err);
          showToast('ERROR ADDING');
        });
      } else {
        const fallbackTask = {
          id: Math.random().toString(36).substring(2, 6),
          title: text,
          weight_score: selectedWeight,
          deadline_str: `${selectedDurationMinutes}m`,
          created_at: new Date().toISOString(),
          deadline_at: new Date(Date.now() + selectedDurationMinutes * 60000).toISOString()
        };
        addDieToStack(fallbackTask, false);
        showToast('LOCAL ADDED');
      }
    });

    // Mousemove hover inspection hit detection on resting dice with canvas scaling
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = rect.width > 0 ? (canvas.width / rect.width) : 1;
      const scaleY = rect.height > 0 ? (canvas.height / rect.height) : 1;
      mousePos.x = (e.clientX - rect.left) * scaleX;
      mousePos.y = (e.clientY - rect.top) * scaleY;
      hoveredDie = null;

      const centerX = 200;
      for (let i = diceStack.length - 1; i >= 0; i--) {
        const d = diceStack[i];
        // Resting die check (|currentY - targetY| <= 2.0)
        if (Math.abs(d.currentY - d.targetY) <= 2.0 && Math.abs(d.velocityY) <= 0.5) {
          const cfg = DICE_CONFIG[d.weight_score] || DICE_CONFIG[3];
          const rx = cfg.width / 2;
          const topY = d.currentY - cfg.ry;
          const botY = d.currentY + cfg.ry + cfg.height;
          if (mousePos.x >= centerX - rx && mousePos.x <= centerX + rx && mousePos.y >= topY && mousePos.y <= botY) {
            hoveredDie = d;
            break;
          }
        }
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hoveredDie = null;
      mousePos = { x: -1, y: -1 };
    });

    /**
     * Draws floating retro inspection tooltip with full title word wrapping,
     * weight, rot stage [X/5], countdown timer (CÒN / blinking red QUÁ HẠN),
     * and smart 4-way clamping inside 400x320 canvas.
     */
    function drawRetroTooltip(c, die) {
      if (!die) return;
      const rot = getEffectiveRotFactor(die);
      const stage = Math.max(1, Math.min(5, Math.floor(rot * 5) + 1));
      const isOverdue = (rot >= 1.0);

      const createdTime = new Date(die.created_at).getTime();
      const deadlineTime = new Date(die.deadline_at).getTime();
      const now = Date.now();
      const diffSec = Math.floor(Math.abs(deadlineTime - now) / 1000);
      const m = Math.floor(diffSec / 60);
      const s = diffSec % 60;
      const timeStr = isOverdue ? `QUÁ HẠN: +${m}m ${s}s` : `CÒN: ${m}m ${s}s`;

      c.save();
      c.font = '6px "Press Start 2P"';
      const measure = (str) => (c.measureText ? c.measureText(str).width : str.length * 6);

      // 1. Full Title multi-line wrapping (up to 2 lines)
      const fullTitle = (die.title || 'UNTITLED').trim();
      const maxLineWidth = 180;
      const words = fullTitle.split(/\s+/);
      let lines = [];
      let currentLine = '';
      let hasMore = false;

      for (let w = 0; w < words.length; w++) {
        const word = words[w];
        if (!word) continue;
        const testLine = currentLine ? `${currentLine} ${word}` : word;
        if (measure(testLine) <= maxLineWidth) {
          currentLine = testLine;
        } else {
          if (currentLine) {
            lines.push(currentLine);
            currentLine = '';
            if (lines.length >= 2) { hasMore = true; break; }
          }
          if (measure(word) <= maxLineWidth) {
            currentLine = word;
          } else {
            // Word is wider than maxLineWidth: chunk by code points safely (protects surrogate pairs & diacritics)
            const normWord = word.normalize ? word.normalize('NFC') : word;
            let chunk = '';
            for (const ch of Array.from(normWord)) {
              if (measure(chunk + ch) <= maxLineWidth) {
                chunk += ch;
              } else {
                if (chunk) {
                  lines.push(chunk);
                  if (lines.length >= 2) {
                    chunk = '';
                    hasMore = true;
                    break;
                  }
                }
                chunk = ch;
              }
            }
            currentLine = chunk;
            if (lines.length >= 2) { hasMore = true; break; }
          }
        }
      }
      if (currentLine && lines.length < 2) lines.push(currentLine);
      if (lines.length === 0) lines.push(Array.from(fullTitle).slice(0, 22).join(''));
      if (lines.length > 2) lines = lines.slice(0, 2);
      if (hasMore && lines.length === 2) {
        let l2Chars = Array.from(lines[1]);
        while (l2Chars.length > 0 && measure(l2Chars.join('') + '...') > maxLineWidth) {
          l2Chars.pop();
        }
        lines[1] = l2Chars.join('') + '...';
      }
      for (let i = 0; i < lines.length; i++) {
        while (lines[i].length > 0 && measure(lines[i]) > maxLineWidth) {
          let chars = Array.from(lines[i]);
          chars.pop();
          lines[i] = chars.join('');
        }
      }

      // Dynamic box dimensions
      let maxTitleWidth = 0;
      for (let i = 0; i < lines.length; i++) {
        const lw = measure(lines[i]);
        if (lw > maxTitleWidth) maxTitleWidth = lw;
      }
      const timeWidth = measure(timeStr);
      const metaStr = `W:${die.weight_score} | STAGE: [${stage}/5]`;
      const metaWidth = measure(metaStr);
      const contentWidth = Math.max(maxTitleWidth, Math.max(timeWidth, metaWidth));

      const tooltipWidth = Math.max(160, Math.min(230, Math.floor(contentWidth + 16)));
      const tooltipHeight = (lines.length > 1) ? 58 : 46;
      const padding = 8;

      // 2. Smart Clamping: 4-way 400x320 Canvas Boundary Guard
      let tooltipX = mousePos.x + 12;
      if (tooltipX + tooltipWidth > 400 - padding) {
        tooltipX = mousePos.x - tooltipWidth - 12;
      }
      tooltipX = Math.max(padding, Math.min(400 - tooltipWidth - padding, tooltipX));

      let tooltipY = mousePos.y - tooltipHeight - 8;
      if (tooltipY < padding) {
        tooltipY = mousePos.y + 22;
      }
      tooltipY = Math.max(padding, Math.min(320 - tooltipHeight - padding, tooltipY));

      // 3. Render Tooltip Frame
      c.fillStyle = 'rgba(18, 20, 23, 0.96)';
      c.fillRect(tooltipX, tooltipY, tooltipWidth, tooltipHeight);

      // 2px Glowing pixel border (gold or red if overdue)
      c.strokeStyle = isOverdue ? '#e76e55' : 'rgba(255, 215, 0, 0.9)'; // 2px glowing pixel border
      c.lineWidth = 2;
      c.strokeRect(tooltipX, tooltipY, tooltipWidth, tooltipHeight);

      // 4. Content Typography
      let hasClip = false;
      if (typeof c.clip === 'function') {
        c.save();
        c.beginPath();
        c.rect(tooltipX, tooltipY, tooltipWidth, tooltipHeight);
        if (typeof c.clip === 'function') c.clip();
        hasClip = true;
      }

      let textY = tooltipY + 12;
      c.textAlign = 'left';
      c.textBaseline = 'alphabetic';

      // Title lines
      c.fillStyle = '#ffffff';
      for (let l = 0; l < lines.length; l++) {
        c.fillText(lines[l], tooltipX + 6, textY);
        textY += 10;
      }

      // Weight & Stage line
      const stageColors = ['#fdfbf7', '#fdfbf7', '#eae0c8', '#8a8d8f', '#4a5d4e', '#a3e635'];
      c.fillStyle = '#92cc41';
      const wLabel = `W:${die.weight_score} | `;
      c.fillText(wLabel, tooltipX + 6, textY);
      const wWidth = measure(wLabel);
      c.fillStyle = stageColors[stage] || '#ffd700';
      c.fillText(`STAGE: [${stage}/5]`, tooltipX + 6 + wWidth, textY);
      textY += 11;

      // Countdown timer line (Blinking red if overdue, NES Yellow if active)
      const blink = Math.floor(now / 220) % 2 === 0;
      if (isOverdue) {
        c.fillStyle = blink ? '#ff2222' : '#881111'; // Blinking red when overdue
      } else {
        c.fillStyle = '#f7d51d';
      }
      c.fillText(timeStr, tooltipX + 6, textY);

      if (hasClip) {
        c.restore();
      }

      c.restore();
    }

    // Double-Click Hit Detection on Dice Stack
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTaskName = document.getElementById('modalTaskName');
    const confirmCompleteBtn = document.getElementById('confirmCompleteBtn');
    const cancelCompleteBtn = document.getElementById('cancelCompleteBtn');

    canvas.addEventListener('dblclick', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = rect.width > 0 ? (canvas.width / rect.width) : 1;
      const scaleY = rect.height > 0 ? (canvas.height / rect.height) : 1;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;
      const centerX = 200;

      // Scan from top die (highest index) down to bottom die (index 0)
      for (let i = diceStack.length - 1; i >= 0; i--) {
        const d = diceStack[i];

        // State lock: Only bind to resting blocks! Ignore falling / collapsing blocks
        if (Math.abs(d.currentY - d.targetY) > 2.0 || Math.abs(d.velocityY) > 0.5) {
          continue;
        }

        const cfg = DICE_CONFIG[d.weight_score] || DICE_CONFIG[3];
        const rx = cfg.width / 2;
        const ry = cfg.width / 4;

        // Bounding box: x in [centerX - rx, centerX + rx], y in [currentY - ry, currentY + ry + height]
        const topY = d.currentY - ry;
        const botY = d.currentY + ry + cfg.height;
        const leftX = centerX - rx;
        const rightX = centerX + rx;

        if (mx >= leftX && mx <= rightX && my >= topY && my <= botY) {
          selectedTask = d;
          modalTaskName.textContent = `TASK: "${d.title}"`;
          modalOverlay.style.display = 'flex';
          return;
        }
      }
    });

    // Anti-Slacking Modal: Confirm Completion
    confirmCompleteBtn.addEventListener('click', () => {
      if (!selectedTask) {
        modalOverlay.style.display = 'none';
        return;
      }

      const taskId = selectedTask.id;
      const taskIndex = diceStack.findIndex(d => d.id === taskId);

      // Overdue streak reset (0) vs on-time streak increment (++)
      const rotVal = getEffectiveRotFactor(selectedTask);
      const isOverdue = (rotVal >= 1.0);
      if (isOverdue) {
        sessionStreak = 0;
        spawnFloatingText(200, 100, `STREAK LOST! OVERDUE`, '#e76e55');
      } else {
        sessionStreak++;
        if (sessionStreak >= 2) {
          spawnFloatingText(200, 100, `+1 STREAK! COMBO x${sessionStreak}`, '#f7d51d');
        }
      }

      // Screen juice shake & particle explosion
      triggerScreenShake(6, 4);
      triggerDiceExplosion(selectedTask);

      // Remove from active stack
      if (taskIndex !== -1) {
        diceStack.splice(taskIndex, 1);
      }
      if (diceStack.length === 0 && hasHadTasks) {
        hasClearedAll = true;
        spawnFloatingText(200, 140, 'ALL TASKS CLEARED!', '#ffd700');
      }

      // Recalculate targets for upper dice to collapse downward (and unlock input if was at 10)
      recalculateTargets();

      // Call Python backend persistence
      if (window.pywebview && window.pywebview.api && window.pywebview.api.complete_task) {
        window.pywebview.api.complete_task(taskId).then((res) => {
          if (res && res.was_overdue) {
            sessionStreak = 0;
          }
          showToast('TASK COMPLETED!');
        }).catch(err => {
          console.error('[TaskbarDice] complete_task error:', err);
        });
      } else {
        showToast('TASK COMPLETED!');
      }

      modalOverlay.style.display = 'none';
      selectedTask = null;
    });

    // Anti-Slacking Modal: Cancel
    cancelCompleteBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
      selectedTask = null;
    });

    // Developer Speed-Test Mode listener (Key 'D')
    window.addEventListener('keydown', (e) => {
      if (e.target === taskInput) return;

      if (e.key === 'd' || e.key === 'D') {
        devMode = (devMode + 1) % 7;
        let modeLabel = '';
        if (devMode === 0) modeLabel = '[D] REALTIME';
        else if (devMode === 1) modeLabel = '[D] STAGE 1 (IVORY)';
        else if (devMode === 2) modeLabel = '[D] STAGE 2 (SANDY)';
        else if (devMode === 3) modeLabel = '[D] STAGE 3 (CRACKED)';
        else if (devMode === 4) modeLabel = '[D] STAGE 4 (MOSSY)';
        else if (devMode === 5) modeLabel = '[D] STAGE 5 (NECROTIC)';
        else if (devMode === 6) modeLabel = '[D] STAGE 5 (OVERDUE)';

        rotStatusBadge.textContent = modeLabel;
        showToast(modeLabel);
      }
    });

    // Close button
    const closeBtn = document.getElementById('closeBtn');
    closeBtn.addEventListener('click', () => {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.close_app) {
        window.pywebview.api.close_app();
      } else {
        window.close();
      }
    });
  </script>
</body>
